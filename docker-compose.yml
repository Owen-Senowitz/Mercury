# Local development environment for Project Mercury.
# Owner: @Owen-Senowitz
# Purpose: runs the PostgreSQL instance the .NET 10 API develops against.
#
# Usage:
#   copy .env.example to .env, then:
#     docker compose up -d                   # database only
#     docker compose --profile tools up -d   # database + Adminer on http://localhost:8080
#
# Credentials come from .env and are local-development only. Never commit .env.

name: mercury

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercury-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      # C collation keeps index ordering identical across developer machines and CI.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      # Bound to the loopback interface so the database is never exposed to the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:5
    container_name: mercury-adminer
    restart: unless-stopped
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: mercury-postgres-data
